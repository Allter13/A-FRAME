<html>
  <head>
    <meta charset="utf-8">
    <title>Ciudad</title>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.7.0/dist/aframe-extras.min.js"></script>
  </head>
  <body>
    <a-scene>
      <!-- ASSETS: Carga del modelo 3D -->
      <a-assets>
        <a-asset-item id="robot" src="Ciudad.glb"></a-asset-item>
        <a-asset-item id="Farola" src="Farola.glb"></a-asset-item>
      </a-assets>

      <!-- Robot 3D -->
      <a-entity gltf-model="#robot" position="0 0 -3" scale="200 200 200" rotation="0 0 0"></a-entity>
      <a-entity gltf-model="#Farola" position="-2 0 -3" scale="0.2 0.2 0.2" rotation="0 0 0"></a-entity>
      <a-entity gltf-model="#Farola" position="-2 0 -10" scale="0.2 0.2 0.2" rotation="0 0 0"></a-entity>
      
      <a-sphere position="-0.5 2.6 -10" radius="0.1"  color="yellow">
      <a-light type="spot" color="yellow" intensity="0.8" rotation="-90 0 0"></a-light>
      </a-sphere>
      <a-sphere position="-0.5 2.6 -3" radius="0.1"  color="yellow">
      <a-light type="spot" color="yellow" intensity="0.8" rotation="-90 0 0"></a-light>
      </a-sphere>
      <!-- Cielo -->
      <a-sky color="#87CEEB"></a-sky>

      <a-light type="directional" color="white" intensity="0.5" position="-4 1 0"></a-light>
       <a-light type="ambient" color="white" intensity="0.5" ></a-light>

      <a-entity movement-controls="fly:true" position="0 1.6 0" rotation="0 0 0"> 
      <a-camera wasd-controls="acceleration:100; fly:true" look-controls position="0 1.6 0"></a-camera> <!-- Esta es por defecto a la altura de los ojos -->
      <a-entity oculus-touch-controls="hand: right"></a-entity>
      <a-entity oculus-touch-controls="hand: left"></a-entity>
      </a-entity>
    </a-scene>
  </body>
</html>
