<html>
  <head>
    <meta charset="utf-8">
    <title>Ciudad</title>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>


         <!-- Cámara -->
       <a-entity position="0 1.6 0">
       <a-camera>
       <a-cursor 
        color="#ffcc00" 
        fuse="true" 
        fuse-timeout="800"
        geometry="primitive: ring; radiusInner: 0.01; radiusOuter: 0.018">
        </a-cursor>
       </a-camera>
       </a-entity>
        
        
        
        <a-entity  vive-controls = "mano: izquierda" > </a-entity > 
        <a-entity  vive-controls = "mano: derecha" > </a-entity >
        <a-entity  hand-controls = "mano: izquierda" > </a-entity > 
        <a-entity  hand-controls = "mano: derecha" > </a-entity > 
        <a-entity  laser-controls = "mano: izquierda" > </a-entity > 
        <a-entity  laser-controls = "mano: derecha" > </a-entity >
        <a-entity  meta-touch-controls = "mano: izquierda" > </a-entity > 
        <a-entity  meta-touch-controls = "mano: derecha" > </a-entity >

      <!-- ASSETS: Carga del modelo 3D -->
      <a-assets>
        <a-asset-item id="robot" src="Ciudad.glb"></a-asset-item>
      </a-assets>

      <!-- Robot 3D -->
      <a-entity gltf-model="#robot" position="0 0 -3" scale="300 300 300" rotation="0 0 0"></a-entity>
      
      <!-- Cielo -->
      <a-sky color="#87CEEB"></a-sky>
    </a-scene>
  </body>
</html>
