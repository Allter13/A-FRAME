<html>
  <head>
    <meta charset="utf-8">
    <title>Ciudad</title>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>


      <!-- ASSETS: Carga del modelo 3D -->
      <a-assets>
        <a-asset-item id="robot" src="Ciudad.glb"></a-asset-item>
      </a-assets>

      <!-- Robot 3D -->
      <a-entity gltf-model="#robot" position="0 0 -3" scale="300 300 300" rotation="0 0 0"></a-entity>
      
      <!-- Cielo -->
      <a-sky color="#87CEEB"></a-sky>
        <!-- Luz -->
        <a-light 
        type="ambient" 
        color="#666">
        </a-light>
          <!-- Luz direccional dramática -->
  <a-light 
    type="directional" 
    color="#ffffff"
    intensity="0.6"
    position="1 4 -2">
  </a-light>
  
    </a-scene>
  </body>
</html>
